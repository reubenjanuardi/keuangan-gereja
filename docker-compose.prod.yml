version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/reubenjanuardi/keuangan-gereja:latest}
    container_name: keuangan-gereja-app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Mount environment file produksi dari host VPS
      - ./.env:/var/www/html/.env:ro
      # Mount direktori logging persisten untuk troubleshooting & audit
      - ./storage/logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
